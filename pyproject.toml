[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eclipse-harness"
version = "0.2.0"
description = "Skills-first contracts and adapters for architect-worker-reviewer coding workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Benedict Davon Martono"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.18",
  "mypy>=1.10",
  "pytest>=7.4",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
eclipse = "eclipse_harness.cli:main"

[project.urls]
Homepage = "https://github.com/benedictdavon/eclipse-harness"
Issues = "https://github.com/benedictdavon/eclipse-harness/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eclipse_harness = ["py.typed"]

[tool.setuptools.data-files]
"share/eclipse-harness" = ["policies/sol-luna.json"]
"share/eclipse-harness/schemas" = [
  "schemas/context-manifest.schema.json",
  "schemas/task-contract.schema.json",
  "schemas/result-contract.schema.json",
  "schemas/review-contract.schema.json",
  "schemas/capability-snapshot.schema.json",
  "schemas/evaluation-suite.schema.json",
  "schemas/role-policy.schema.json",
]
"share/eclipse-harness/protocol" = [
  "protocol/context-manifest.md",
  "protocol/task-contract.md",
  "protocol/result-contract.md",
  "protocol/review-contract.md",
  "protocol/routing-policy.md",
]
"share/eclipse-harness/skills/eclipse-orchestrate" = [".agents/skills/eclipse-orchestrate/SKILL.md"]
"share/eclipse-harness/skills/eclipse-orchestrate/references" = [
  ".agents/skills/eclipse-orchestrate/references/contracts.md",
  ".agents/skills/eclipse-orchestrate/references/routing.md",
  ".agents/skills/eclipse-orchestrate/references/concurrency-security.md",
]
"share/eclipse-harness/skills/eclipse-execute" = [".agents/skills/eclipse-execute/SKILL.md"]
"share/eclipse-harness/skills/eclipse-execute/references" = [
  ".agents/skills/eclipse-execute/references/execution.md",
  ".agents/skills/eclipse-execute/references/evidence-escalation.md",
  ".agents/skills/eclipse-execute/references/security.md",
]
"share/eclipse-harness/skills/eclipse-review" = [".agents/skills/eclipse-review/SKILL.md"]
"share/eclipse-harness/skills/eclipse-review/references" = [
  ".agents/skills/eclipse-review/references/review-contract.md",
  ".agents/skills/eclipse-review/references/findings.md",
]
"share/eclipse-harness/skills/eclipse-doctor" = [".agents/skills/eclipse-doctor/SKILL.md"]
"share/eclipse-harness/skills/eclipse-doctor/references" = [
  ".agents/skills/eclipse-doctor/references/capabilities.md",
  ".agents/skills/eclipse-doctor/references/host-probes.md",
]
"share/eclipse-harness/skills/eclipse-bootstrap" = [".agents/skills/eclipse-bootstrap/SKILL.md"]
"share/eclipse-harness/skills/eclipse-bootstrap/references" = [
  ".agents/skills/eclipse-bootstrap/references/installation.md",
  ".agents/skills/eclipse-bootstrap/references/capability-modes.md",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/self_check.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["eclipse_harness"]
